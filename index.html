/* ═══════════════════════════════════════════════════════════════
   DCA GLOBAL COMPOUNDER — read-only ledger.

   ▼▼▼ EVERYTHING EDITABLE LIVES IN THIS ONE BLOCK ▼▼▼
   Ping Claude with: investor, amount, date. Claude pulls positions,
   cash, trades, conversions and daily prices from IBKR.

   TRADE MERGING RULE — applies to every future update:
   IBKR splits one order into a main fill (LSEETF) plus a fractional
   remainder (EUIBSI, zero commission). These are ONE trade. Always
   merge them into a single row: sum the shares, use the share-weighted
   average price, and carry the single commission. Never list the
   fractional fill separately.

   Model (reporting currency SGD, assets priced in USD):
     Securities USD = Σ(shares × usdPrice)
     Fund value SGD = (Securities USD + cashUSD) × fxRate + cashSGD
     NAV / unit      = fund value ÷ units outstanding
     Units issued    = amount ÷ navAtEntry

   FX attribution — USD is treated as a position with a cost basis:
     avgRate  = total SGD converted ÷ total USD received
     FX P&L   = USD acquired × (fxRate − avgRate)
     Stock    = (USD held − USD acquired) × fxRate
     The two sum exactly to total profit on USD assets.

   Daily blocks are "YYYY-MM-DD  value", one line per trading day.
   Append only; never rewrite past rows.
   ═══════════════════════════════════════════════════════════════ */

  ],

/* ═══════════ nothing below here needs editing ═══════════ */




const money = (n) =>
  (n < 0 ? "−" : "") +
  "S$" +
  Math.abs(n).toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const usd = (n) =>
  (n < 0 ? "−" : "") +
  "US$" +
  Math.abs(n).toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const plain = (n, dp = 2) =>
  n.toLocaleString("en-SG", { minimumFractionDigits: dp, maximumFractionDigits: dp });

const pct = (n, dp = 2) => (n >= 0 ? "+" : "−") + Math.abs(n * 100).toFixed(dp) + "%";

const shortDate = (s) =>
  new Date(s + "T00:00:00").toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "2-digit" });

const longDate = (s) =>
  new Date(s + "T00:00:00").toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });

function parseSeries(block) {
  if (!block) return [];
  return block
    .split("\n")
    .map((l) => l.trim())
    .filter((l) => l && !l.startsWith("#"))
    .map((l) => {
      const [date, v] = l.split(/\s+/);
      return { date, value: Number(v) };
    })
    .filter((p) => p.date && Number.isFinite(p.value) && p.value > 0)
    .sort((a, b) => a.date.localeCompare(b.date));
}

function sharesAsAt(ticker, date) {
  return FUND.trades
    .filter((t) => t.ticker === ticker && t.date <= date)
    .reduce((s, t) => s + (String(t.side).toUpperCase() === "SELL" ? -Math.abs(t.shares) : Math.abs(t.shares)), 0);
}

function valueAsAt(series, date) {
  let v = null;
  for (const p of series) {
    if (p.date <= date) v = p.value;
    else break;
  }
  return v;
}

function build() {
  const lots = [];
  const people = {};

  [...FUND.contributions]
    .sort((a, b) => a.date.localeCompare(b.date))
    .forEach((c, i) => {
      const units = c.amount / c.navAtEntry;
      if (!people[c.person]) people[c.person] = { units: 0, net: 0, since: c.date, lots: [] };
      people[c.person].units += units;
      people[c.person].net += c.amount;
      const lot = {
        key: c.date + c.person + i,
        date: c.date,
        person: c.person,
        amount: c.amount,
        navAtEntry: c.navAtEntry,
        units,
        note: c.note || "",
      };
      people[c.person].lots.push(lot);
      lots.push(lot);
    });

  const fx = FUND.fxRate;

  // Holdings carry USD prices; SGD figures are translated at today's rate.
  const holdings = FUND.holdings
    .map((h) => {
      const costUsd = h.shares * h.avgCost;
      const valueUsd = h.shares * h.price;
      return {
        ...h,
        costUsd,
        valueUsd,
        plUsd: valueUsd - costUsd,
        roi: costUsd !== 0 ? (valueUsd - costUsd) / costUsd : 0,
        valueSgd: valueUsd * fx,
        costSgd: costUsd * fx,
      };
    })
    .sort((a, b) => b.valueUsd - a.valueUsd);

  const trades = [...FUND.trades].sort((a, b) => b.date.localeCompare(a.date));
  const conversions = [...FUND.conversions].sort((a, b) => b.date.localeCompare(a.date));

  const securitiesUsd = holdings.reduce((s, h) => s + h.valueUsd, 0);
  const usdHeld = securitiesUsd + FUND.cashUSD;
  const fundValue = usdHeld * fx + FUND.cashSGD;

  // USD as a position: cost basis from the conversion log.
  const sgdConverted = FUND.conversions.reduce((s, c) => s + c.sgd, 0);
  const usdAcquired = FUND.conversions.reduce((s, c) => s + c.usd, 0);
  const avgRate = usdAcquired > 0 ? sgdConverted / usdAcquired : 0;
  const fxPl = usdAcquired > 0 ? usdAcquired * (fx - avgRate) : 0;
  const stockPlSgd = (usdHeld - usdAcquired) * fx;

  const unitsOut = lots.reduce((s, l) => s + l.units, 0);
  const netIn = lots.reduce((s, l) => s + l.amount, 0);
  const nav = unitsOut > 0 ? fundValue / unitsOut : 0;

  const daily = parseSeries(FUND.navDaily);
  if (nav > 0 && (!daily.length || daily[daily.length - 1].date !== FUND.pricedAsOf)) {
    daily.push({ date: FUND.pricedAsOf, value: nav });
  }

  const enriched = daily.map((p, i) => {
    const unitsThen = lots.filter((l) => l.date <= p.date).reduce((s, l) => s + l.units, 0);
    const prev = i > 0 ? daily[i - 1].value : null;
    return {
      ...p,
      nav: p.value,
      units: unitsThen,
      fundValue: unitsThen * p.value,
      dayChange: prev ? p.value / prev - 1 : null,
      cumulative: FUND.inceptionNav ? p.value / FUND.inceptionNav - 1 : 0,
    };
  });

  let peak = -Infinity;
  let maxDD = 0;
  enriched.forEach((p) => {
    peak = Math.max(peak, p.value);
    p.drawdown = peak > 0 ? p.value / peak - 1 : 0;
    maxDD = Math.min(maxDD, p.drawdown);
  });

  const prices = {};
  Object.entries(FUND.priceDaily || {}).forEach(([t, block]) => {
    const s = parseSeries(block);
    const h = holdings.find((x) => x.ticker === t);
    if (h && (!s.length || s[s.length - 1].date !== FUND.pricedAsOf)) {
      s.push({ date: FUND.pricedAsOf, value: h.price });
    }
    prices[t] = s;
  });

  const fxSeries = parseSeries(FUND.fxDaily);
  if (!fxSeries.length || fxSeries[fxSeries.length - 1].date !== FUND.pricedAsOf) {
    fxSeries.push({ date: FUND.pricedAsOf, value: fx });
  }

  const cashSeries = parseSeries(FUND.cashDaily);
  const cashByDate = {};
  cashSeries.forEach((p) => (cashByDate[p.date] = p.value));
  if (cashByDate[FUND.pricedAsOf] == null) {
    cashByDate[FUND.pricedAsOf] = FUND.cashSGD + FUND.cashUSD * fx;
  }

  return {
    lots,
    people,
    holdings,
    trades,
    conversions,
    securitiesUsd,
    usdHeld,
    usdAcquired,
    sgdConverted,
    avgRate,
    fxPl,
    stockPlSgd,
    fundValue,
    unitsOut,
    netIn,
    nav,
    fx,
    daily: enriched,
    maxDD,
    prices,
    fxSeries,
    cashByDate,
  };
}

function exportWorkbook(B, roster) {
  const wb = XLSX.utils.book_new();

  const summary = [
    ["Fund", FUND.name],
    ["Reporting currency", FUND.currency],
    ["Priced as of", FUND.pricedAsOf],
    ["Fund value SGD", B.fundValue],
    ["Cash SGD", FUND.cashSGD],
    ["Cash USD", FUND.cashUSD],
    ["Securities USD", B.securitiesUsd],
    ["USD held", B.usdHeld],
    ["USD acquired", B.usdAcquired],
    ["SGD converted", B.sgdConverted],
    ["Avg acquisition rate", B.avgRate],
    ["FX rate today", B.fx],
    ["FX profit SGD", B.fxPl],
    ["Stock profit SGD", B.stockPlSgd],
    ["Capital in", B.netIn],
    ["Total profit", B.fundValue - B.netIn],
    ["Units outstanding", B.unitsOut],
    ["NAV per unit", B.nav],
    ["Return since inception", B.nav / FUND.inceptionNav - 1],
    ["Max drawdown", B.maxDD],
  ].map(([Field, Value]) => ({ Field, Value }));

  const ownership = roster.map((r) => ({
    Investor: r.person,
    Units: r.units,
    Share: r.share,
    CapitalIn: r.net,
    ValueNow: r.value,
    Profit: r.pl,
    Return: r.roi,
    Since: r.since,
    AvgEntryNav: r.units ? r.net / r.units : 0,
  }));

  const transactions = B.lots.map((l) => ({
    Date: l.date,
    Investor: l.person,
    Amount: l.amount,
    NavAtEntry: l.navAtEntry,
    UnitsIssued: l.units,
    ValueNow: l.units * B.nav,
    Profit: l.units * B.nav - l.amount,
    Note: l.note,
  }));

  const holdings = B.holdings.map((h) => ({
    Ticker: h.ticker,
    Shares: h.shares,
    AvgCostUSD: h.avgCost,
    PriceUSD: h.price,
    CostUSD: h.costUsd,
    ValueUSD: h.valueUsd,
    ProfitUSD: h.plUsd,
    Return: h.roi,
    ValueSGD: h.valueSgd,
    Weight: B.fundValue ? h.valueSgd / B.fundValue : 0,
  }));

  const trades = B.trades.map((t) => ({
    Date: t.date,
    Ticker: t.ticker,
    Side: t.side,
    Shares: Math.abs(t.shares),
    PriceUSD: t.price,
    ValueUSD: Math.abs(t.shares * t.price),
    CommissionUSD: t.commission ?? "",
  }));

  const conversions = B.conversions.map((c) => ({
    Date: c.date,
    SGD: c.sgd,
    USD: c.usd,
    RateExecuted: c.rate,
  }));

  const navDaily = B.daily.map((p) => ({
    Date: p.date,
    NavPerUnit: p.nav,
    DailyChange: p.dayChange ?? "",
    CumulativeReturn: p.cumulative,
    DrawdownFromPeak: p.drawdown,
    UnitsOutstanding: p.units,
    FundValueSGD: p.fundValue,
    FxRate: valueAsAt(B.fxSeries, p.date) ?? "",
  }));

  const names = roster.map((r) => r.person);
  const ownershipDaily = B.daily.map((p) => {
    const row = { Date: p.date, NavPerUnit: p.nav, TotalUnits: p.units, FundValue: p.fundValue };
    names.forEach((n) => {
      const u = B.people[n].lots.filter((l) => l.date <= p.date).reduce((s, l) => s + l.units, 0);
      const paid = B.people[n].lots.filter((l) => l.date <= p.date).reduce((s, l) => s + l.amount, 0);
      row[`${n} Units`] = u;
      row[`${n} Value`] = u * p.nav;
      row[`${n} CapitalIn`] = paid;
      row[`${n} Profit`] = u * p.nav - paid;
      row[`${n} Share`] = p.units ? u / p.units : 0;
    });
    return row;
  });

  const tickers = Object.keys(B.prices);
  const positionsDaily = [];
  B.daily.forEach((d) => {
    const rate = valueAsAt(B.fxSeries, d.date);
    tickers.forEach((t) => {
      const shares = sharesAsAt(t, d.date);
      if (Math.abs(shares) < 1e-9) return;
      const close = valueAsAt(B.prices[t] || [], d.date);
      if (close == null) return;
      positionsDaily.push({
        Date: d.date,
        Ticker: t,
        Shares: shares,
        CloseUSD: close,
        MarketValueUSD: shares * close,
        FxRate: rate ?? "",
        MarketValueSGD: rate ? shares * close * rate : "",
      });
    });
  });

  const priceHistory = [];
  Object.entries(B.prices).forEach(([ticker, series]) =>
    series.forEach((p) => priceHistory.push({ Date: p.date, Ticker: ticker, CloseUSD: p.value }))
  );
  priceHistory.sort((a, b) => a.Date.localeCompare(b.Date) || a.Ticker.localeCompare(b.Ticker));

  const fxHistory = B.fxSeries.map((p) => ({ Date: p.date, SgdPerUsd: p.value }));

  const reconstruction = B.daily.map((d) => {
    const rate = valueAsAt(B.fxSeries, d.date);
    let secUsd = 0;
    tickers.forEach((t) => {
      const shares = sharesAsAt(t, d.date);
      const close = valueAsAt(B.prices[t] || [], d.date);
      if (close != null) secUsd += shares * close;
    });
    const cashThen = B.cashByDate[d.date] ?? "";
    const total = typeof cashThen === "number" && rate ? secUsd * rate + cashThen : "";
    const derived = typeof total === "number" && d.units ? total / d.units : "";
    return {
      Date: d.date,
      SecuritiesUSD: secUsd,
      FxRate: rate ?? "",
      SecuritiesSGD: rate ? secUsd * rate : "",
      CashSGD: cashThen,
      FundValueSGD: total,
      UnitsOutstanding: d.units,
      NavDerived: derived,
      NavRecorded: d.nav,
      Difference: typeof derived === "number" ? derived - d.nav : "",
    };
  });

  [
    ["Summary", summary],
    ["Ownership", ownership],
    ["Transactions", transactions],
    ["Holdings", holdings],
    ["Trades", trades],
    ["Conversions", conversions],
    ["NAV daily", navDaily],
    ["Ownership daily", ownershipDaily],
    ["Positions daily", positionsDaily],
    ["Price history", priceHistory],
    ["FX history", fxHistory],
    ["NAV reconstruction", reconstruction],
  ].forEach(([name, rows]) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]);
    XLSX.utils.book_append_sheet(wb, ws, name);
  });

  const slug = FUND.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  XLSX.writeFile(wb, `${slug}-${FUND.pricedAsOf}.xlsx`);
}

function FundLedger() {
  const [tab, setTab] = useState("ownership");
  const [view, setView] = useState("investors");
  const [tradeView, setTradeView] = useState("stock");
  const [focus, setFocus] = useState(null);
  const [ticker, setTicker] = useState(null);
  const B = useMemo(() => build(), []);

  const roster = Object.entries(B.people)
    .map(([person, v]) => {
      const value = v.units * B.nav;
      return {
        person,
        since: v.since,
        units: v.units,
        net: v.net,
        lots: v.lots,
        value,
        pl: value - v.net,
        roi: v.net !== 0 ? (value - v.net) / v.net : 0,
        share: B.unitsOut > 0 ? v.units / B.unitsOut : 0,
      };
    })
    .sort((a, b) => b.units - a.units);

  const profit = B.fundValue - B.netIn;
  const fundReturn = FUND.inceptionNav ? B.nav / FUND.inceptionNav - 1 : 0;
  const focused = focus ? roster.find((r) => r.person === focus) : null;
  const held = ticker ? B.holdings.find((h) => h.ticker === ticker) : null;

  const investorDaily = useMemo(() => {
    if (!focused) return [];
    return B.daily
      .filter((d) => d.date >= focused.since)
      .map((d) => {
        const u = focused.lots.filter((l) => l.date <= d.date).reduce((s, l) => s + l.units, 0);
        const paid = focused.lots.filter((l) => l.date <= d.date).reduce((s, l) => s + l.amount, 0);
        return { date: d.date, value: u * d.nav, cost: paid };
      });
  }, [focused, B]);

  const goTab = (t) => {
    setTab(t);
    setFocus(null);
    setTicker(null);
  };

  return (
    <div className="fl">
      <Styles />

      <header className="fl-head">
        <h1 className="fl-title">{FUND.name}</h1>
        <div className="fl-plbox">
          <div className="fl-pllabel">Profit since inception</div>
          <div className={"fl-plvalue " + (profit >= 0 ? "pos" : "neg")}>{money(profit)}</div>
          <div className={"fl-pldelta " + (fundReturn >= 0 ? "pos" : "neg")}>{pct(fundReturn)}</div>
        </div>
      </header>

      <div className="fl-strip">
        <Stat label="Fund value" value={money(B.fundValue)} />
        <Stat label="Capital in" value={money(B.netIn)} />
        <Stat label="NAV per unit" value={plain(B.nav, 4)} />
        <Stat label="Units outstanding" value={plain(B.unitsOut, 4)} />
        <Stat label="Cash" value={money(FUND.cashSGD + FUND.cashUSD * B.fx)} />
      </div>

      <SeriesChart
        points={B.daily.map((p) => ({ date: p.date, value: p.value }))}
        baseline={FUND.inceptionNav}
        baselineLabel={`inception ${plain(FUND.inceptionNav, 4)}`}
        title="NAV per unit"
        dp={4}
        idleRight={`max drawdown ${pct(B.maxDD)}`}
        refValue={FUND.inceptionNav}
      />

      <nav className="fl-tabs">
        {[
          ["ownership", "Ownership"],
          ["holdings", "Holdings"],
          ["trades", "Trades"],
        ].map(([k, label]) => (
          <button key={k} className={"fl-tab " + (tab === k ? "on" : "")} onClick={() => goTab(k)}>
            {label}
          </button>
        ))}
        <span className="fl-tabspacer" />
        <button className="fl-export" onClick={() => exportWorkbook(B, roster)}>
          Export to Excel
        </button>
      </nav>

      {tab === "ownership" && !focused && (
        <section>
          <div className="fl-seg">
            <button className={"fl-segbtn " + (view === "investors" ? "on" : "")} onClick={() => setView("investors")}>
              By investor
            </button>
            <button className={"fl-segbtn " + (view === "all" ? "on" : "")} onClick={() => setView("all")}>
              All transactions
            </button>
          </div>

          {view === "investors" ? (
            <div className="fl-cards">

/* ---------------- chart ---------------- */

function SeriesChart({
  points,
  baseline,
  baselineLabel,
  title,
  dp = 2,
  idleRight,
  refValue,
  markers = [],
  secondary,
  hoverExtra,
}) {
  const [hover, setHover] = useState(null);
  const boxRef = useRef(null);

  if (!points || points.length < 2) return null;

  const W = 1000;
  const H = 176;
  const PAD = 14;
  const values = points.map((p) => p.value);
  const secVals = secondary ? secondary.map((p) => p.value) : [];
  const all = [...values, ...secVals];
  const lo = Math.min(...all, baseline || Infinity);
  const hi = Math.max(...all, baseline || -Infinity);
  const pad = (hi - lo) * 0.12 || hi * 0.02 || 1;
  const min = lo - pad;
  const max = hi + pad;

  const fx = (i) => (i / (points.length - 1)) * W;
  const fy = (v) => H - PAD - ((v - min) / (max - min)) * (H - PAD * 2);
  const rx = (i) => (i / (points.length - 1)) * 100;
  const ry = (v) => (fy(v) / H) * 100;

  const line = points.map((p, i) => `${i === 0 ? "M" : "L"}${fx(i).toFixed(1)},${fy(p.value).toFixed(1)}`).join(" ");
  const area = `${line} L${W},${H} L0,${H} Z`;
  const secLine = secondary
    ? secondary.map((p, i) => `${i === 0 ? "M" : "L"}${fx(i).toFixed(1)},${fy(p.value).toFixed(1)}`).join(" ")
    : null;
  const up = points[points.length - 1].value >= points[0].value;
  const stroke = up ? "#1D6B48" : "#A63A28";
  const gid = "g" + title.replace(/\W/g, "");

  const move = (clientX) => {
    const el = boxRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const t = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    setHover(Math.round(t * (points.length - 1)));
  };

  const pt = hover != null ? points[hover] : null;
  const change = pt && refValue ? pt.value / refValue - 1 : null;

  const ticks = [];
  points.forEach((p, i) => {
    if (i && p.date.slice(0, 7) !== points[i - 1].date.slice(0, 7)) ticks.push({ i, date: p.date });
  });

  const pins = markers
    .map((m) => {
      let idx = points.findIndex((p) => p.date >= m.date);
      if (idx < 0) idx = points.length - 1;
      return { ...m, idx, value: points[idx].value };
    })
    .filter((m) => m.idx >= 0);

  return (
    <div className="fl-chart">
      <div className="fl-charthead">
        <span>
          {title} · {points.length} days
        </span>
        <span className="n">
          {pt
            ? hoverExtra
              ? hoverExtra(hover, pt)
              : `${shortDate(pt.date)}  ${plain(pt.value, dp)}${change != null ? "  " + pct(change) : ""}`
            : idleRight}
        </span>
      </div>

      <div
        className="fl-chartbox"
        ref={boxRef}
        onMouseMove={(e) => move(e.clientX)}
        onMouseLeave={() => setHover(null)}
        onTouchStart={(e) => move(e.touches[0].clientX)}
        onTouchMove={(e) => move(e.touches[0].clientX)}
        onTouchEnd={() => setHover(null)}
      >
        <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" className="fl-chartsvg" aria-hidden="true">
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={stroke} stopOpacity="0.13" />
              <stop offset="100%" stopColor={stroke} stopOpacity="0" />
            </linearGradient>
          </defs>
          {ticks.map((t) => (
            <line key={t.date} x1={fx(t.i)} y1="0" x2={fx(t.i)} y2={H} stroke="#EDF0EC" strokeWidth="1" vectorEffect="non-scaling-stroke" />
          ))}
          {baseline > 0 && (
            <line
              x1="0"
              y1={fy(baseline)}
              x2={W}
              y2={fy(baseline)}
              stroke="#C9D4CB"
              strokeWidth="1"
              strokeDasharray="4 4"
              vectorEffect="non-scaling-stroke"
            />
          )}
          <path d={area} fill={`url(#${gid})`} />
          {secLine && (
            <path d={secLine} fill="none" stroke="#6C7C86" strokeWidth="1.25" strokeDasharray="5 4" vectorEffect="non-scaling-stroke" />
          )}
          <path d={line} fill="none" stroke={stroke} strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" />
        </svg>

        {pins.map((m, i) => (
          <div
            key={i}
            className={"fl-pin " + (String(m.side).toUpperCase() === "SELL" ? "sell" : "buy")}
            style={{ left: rx(m.idx) + "%", top: ry(m.value) + "%" }}
            title={`${String(m.side).toUpperCase()} ${Math.abs(m.shares)} @ ${plain(m.price, 2)} · ${shortDate(m.date)}`}
          />
        ))}

        {pt && (
          <>
            <div className="fl-cross" style={{ left: rx(hover) + "%" }} />
            <div className="fl-dot" style={{ left: rx(hover) + "%", top: ry(pt.value) + "%", background: stroke }} />
          </>
        )}
      </div>

      <div className="fl-chartfoot">
        <span>{shortDate(points[0].date)}</span>
        <span className="dim">{baselineLabel}</span>
        <span>{shortDate(points[points.length - 1].date)}</span>
      </div>
    </div>
  );
}

/* ---------------- tables ---------------- */

function LotTable({ lots, nav, showPerson, onPerson }) {
  return (
    <Table
      head={["Date", showPerson ? "Investor" : "Note", "Amount", "NAV at entry", "Units issued", "Value now", "Profit", "Return"]}
    >
      {lots.map((l) => {
        const value = l.units * nav;
        const pl = value - l.amount;
        return (
          <tr key={l.key}>
            <td className="n">{shortDate(l.date)}</td>
            <td>
              {showPerson ? (
                <button className="fl-link" onClick={() => onPerson && onPerson(l.person)}>
                  {l.person}
                </button>
              ) : (
                <span className="dim">{l.note || "—"}</span>
              )}
            </td>
            <td className="r n">{money(l.amount)}</td>
            <td className="r n">{plain(l.navAtEntry, 4)}</td>
            <td className="r n strong">{plain(l.units, 4)}</td>
            <td className="r n">{money(value)}</td>
            <td className={"r n " + (pl >= 0 ? "pos" : "neg")}>{money(pl)}</td>
            <td className={"r n " + (pl >= 0 ? "pos" : "neg")}>{pct(l.amount ? pl / l.amount : 0)}</td>
          </tr>
        );
      })}
      {!lots.length && (
        <tr>
          <td colSpan={8} className="fl-empty">
            No entries recorded.
          </td>
        </tr>
      )}
    </Table>
  );
}

function TradeTable({ trades, showTicker, onTicker }) {
  const head = showTicker
    ? ["Date", "Ticker", "Side", "Shares", "Price", "Value", "Commission"]
    : ["Date", "Side", "Shares", "Price", "Value", "Commission"];

  return (
    <Table head={head}>
      {trades.map((t, i) => {
        const sell = String(t.side).toUpperCase() === "SELL";
        return (
          <tr key={t.date + t.ticker + i}>
            <td className="n">{shortDate(t.date)}</td>
            {showTicker && (
              <td>
                {onTicker ? (
                  <button className="fl-link" onClick={() => onTicker(t.ticker)}>
                    {t.ticker}
                  </button>
                ) : (
                  <span className="fl-name">{t.ticker}</span>
                )}
              </td>
            )}
            <td>
              <span className={"fl-side " + (sell ? "sell" : "buy")}>{sell ? "SELL" : "BUY"}</span>
            </td>
            <td className="r n">{plain(Math.abs(t.shares), 4)}</td>
            <td className="r n">{usd(t.price)}</td>
            <td className="r n strong">{usd(Math.abs(t.shares * t.price))}</td>
            <td className="r n dim">{t.commission != null ? usd(t.commission) : "—"}</td>
          </tr>
        );
      })}
      {!trades.length && (
        <tr>
          <td colSpan={7} className="fl-empty">
            No trades recorded.
          </td>
        </tr>
      )}
    </Table>
  );
}

function Stat({ label, value, sub, tone }) {
  return (
    <div className="fl-stat">
      <div className="fl-statlabel">{label}</div>
      <div className={"fl-statvalue " + (tone || "")}>{value}</div>
      {sub && <div className={"fl-statsub " + (tone || "")}>{sub}</div>}
    </div>
  );
}

function Table({ head, children }) {
  return (
    <div className="fl-tablewrap">
      <table className="fl-table">
        <thead>
          <tr>
            {head.map((h, i) => (
              <th key={h + i} className={i <= 1 ? "" : "r"}>
                {h}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>{children}</tbody>
      </table>
    </div>
  );
}
